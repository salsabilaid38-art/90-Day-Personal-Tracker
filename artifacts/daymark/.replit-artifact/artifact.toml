kind = "web"
previewPath = "/"
title = "Lily Progress"
description = "A private, mobile-first personal tracker for a 90-day countdown, daily habits, projects, and university applications with deadlines and checkable steps. Progress is saved locally on the device."
version = "1.0.0"
id = "artifacts/daymark"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22716

[services.development]
run = "pnpm --filter @workspace/daymark run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daymark", "run", "build" ]
serve = "static"
publicDir = "artifacts/daymark/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22716"
BASE_PATH = "/"
